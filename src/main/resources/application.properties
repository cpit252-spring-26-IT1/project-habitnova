spring.application.name=HabitNova
server.port=8080
spring.thymeleaf.cache=false

# ── H2 Database (file-based — survives restarts) ──
spring.datasource.url=jdbc:h2:file:./data/habitnova;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ──
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── H2 Console (optional — handy for debugging) ──
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
